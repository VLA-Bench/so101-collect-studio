<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>井字棋采集展示 · SO101</title>
<style>
  :root{--bg:#edf0f2;--panel:#fff;--line:#d8dde3;--text:#20252b;--dim:#77808b;--accent:#b94f2f;--ok:#1f8b55;--warn:#b26a00}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  header{height:52px;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
  header b{font-size:16px} #connection{margin-left:auto;color:var(--dim);font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:#9aa3ad;display:inline-block;margin-right:6px}.dot.ok{background:var(--ok);box-shadow:0 0 7px #1f8b5577}.dot.bad{background:#c94040}
  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px}
  #viewport{position:relative;min-width:0;overflow:hidden}
  #threeMount{position:absolute;inset:0}
  #fallback{position:absolute;inset:0;display:none;place-items:center;padding:28px;background:var(--bg)}
  .fallback-wrap{width:min(72vh,620px);text-align:center}.fallback-note{color:var(--warn);margin-bottom:14px}
  .fallback-board{aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:12px;background:#6e747c;border-radius:12px}
  .fallback-cell{display:grid;place-items:center;background:#a6abb1;border-radius:7px;font-size:clamp(38px,8vh,78px);font-weight:800;border:4px solid transparent}
  .fallback-cell.black{color:#111}.fallback-cell.white{color:#f8f8f3;text-shadow:0 1px 3px #0007}.fallback-cell.target{border-color:var(--accent);color:var(--accent);opacity:.65}
  aside{background:var(--panel);border-left:1px solid var(--line);padding:20px 22px;overflow-y:auto}
  #number{font:700 34px ui-monospace,"SF Mono",Menlo,monospace;color:var(--accent);line-height:1.15}
  #progressText{color:var(--dim);margin-top:3px}.progress{height:7px;background:#e8ebef;border-radius:8px;overflow:hidden;margin:10px 0 22px}.progress i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
  #instruction{font-size:18px;font-weight:650;line-height:1.45;margin:0 0 20px}
  dl{display:grid;grid-template-columns:86px 1fr;gap:9px 10px;margin:0;padding-top:16px;border-top:1px dashed var(--line)}dt{color:var(--dim)}dd{margin:0;font-weight:600;word-break:break-all}
  .mono{font:12px/1.5 ui-monospace,"SF Mono",Menlo,monospace}.side{display:inline-flex;align-items:center;gap:7px}.piece{width:14px;height:14px;border-radius:3px;border:1px solid #777}.piece.black{background:#111}.piece.white{background:#f5f5f0}
  .target{margin:18px 0;padding:14px;border:2px solid #d9a18f;background:#f9ebe6;border-radius:10px}.target small{display:block;color:var(--dim)}.target b{font-size:26px;color:var(--accent)}
  .legend{margin-top:22px;color:var(--dim);font-size:12px}.legend strong{color:var(--text)}
  #resetView{position:absolute;right:14px;top:14px;z-index:3;border:1px solid #ccd2d8;background:#ffffffdd;border-radius:7px;padding:6px 11px;cursor:pointer;color:#4d5661}
  #resetView:hover{border-color:var(--accent);color:var(--accent)}
  @media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:minmax(340px,58vh) auto}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<header><b>井字棋采集展示</b><span>只读跟随采集机</span><span id="connection"><i class="dot"></i>连接中…</span></header>
<main>
  <section id="viewport">
    <div id="threeMount"></div>
    <button id="resetView" type="button">重置视角</button>
    <div id="fallback"><div class="fallback-wrap"><div class="fallback-note">Three.js 加载失败，已切换二维棋盘</div><div id="fallbackBoard" class="fallback-board"></div></div></div>
  </section>
  <aside>
    <div id="number">等待棋局…</div><div id="progressText">0 / 300 已完成</div><div class="progress"><i id="progressBar"></i></div>
    <p id="instruction">请在采集机选择 tic_tac_toe 任务集合。</p>
    <div class="target"><small>唯一最优落子</small><b id="targetCell">—</b></div>
    <dl>
      <dt>当前执棋</dt><dd id="side">—</dd>
      <dt>语言任务</dt><dd id="taskSlug" class="mono">—</dd>
      <dt>战术类别</dt><dd id="tactic">—</dd>
      <dt>实例状态</dt><dd id="instanceStatus">—</dd>
      <dt>状态 ID</dt><dd id="stateId" class="mono">—</dd>
    </dl>
    <div class="legend"><strong>格子顺序：</strong>远排 → 中排 → 近排，每排左 → 右。半透明棋子与高亮框表示目标格。</div>
  </aside>
</main>
<script type="module">
let three=null, latest=null, lastKey='';
const $=id=>document.getElementById(id);
const colors={black:0x111111,white:0xf5f5f0};

function setConnection(ok,text){
  const root=$('connection'); root.innerHTML=`<i class="dot ${ok?'ok':'bad'}"></i>${text}`;
}

function disposeGroup(group){
  while(group?.children.length){
    const child=group.children.pop();
    child.traverse(object=>{
      object.geometry?.dispose();
      if(Array.isArray(object.material)) object.material.forEach(material=>material.dispose());
      else object.material?.dispose();
    });
  }
}

function pieceMesh(side,{ghost=false}={}){
  const geometry=new three.THREE.BoxGeometry(.030,.030,.030);
  const material=new three.THREE.MeshStandardMaterial({
    color:colors[side],roughness:side==='black'?.55:.72,transparent:ghost,opacity:ghost?.34:1,depthWrite:!ghost,
  });
  const group=new three.THREE.Group(); group.add(new three.THREE.Mesh(geometry,material));
  if(ghost){
    group.add(new three.THREE.LineSegments(new three.THREE.EdgesGeometry(geometry),new three.THREE.LineBasicMaterial({color:colors[side],transparent:true,opacity:.95})));
  }
  return group;
}

function cellPosition(cell){
  const size=.2/3,row=Math.floor(cell/3),column=cell%3;
  return [(column-1)*size,-.035+(row-1)*size];
}

function rebuild(current){
  renderFallback(current);
  if(!three||!current) return;
  disposeGroup(three.dynamicGroup);
  const y=.018+.015;
  current.board.forEach((side,cell)=>{
    if(!side) return;
    const piece=pieceMesh(side),[x,z]=cellPosition(cell); piece.position.set(x,y,z); three.dynamicGroup.add(piece);
  });
  const ghost=pieceMesh(current.side_to_move,{ghost:true}),[tx,tz]=cellPosition(current.optimal_cell);
  ghost.position.set(tx,y+.0005,tz); ghost.renderOrder=3; three.dynamicGroup.add(ghost);
  const targetGeometry=new three.THREE.PlaneGeometry(.058,.058);
  const edges=new three.THREE.LineSegments(new three.THREE.EdgesGeometry(targetGeometry),new three.THREE.LineBasicMaterial({color:0xb94f2f,linewidth:2}));
  edges.rotation.x=-Math.PI/2; edges.position.set(tx,.0195,tz); three.dynamicGroup.add(edges);
  const loose=pieceMesh(current.side_to_move); loose.position.set(.13,.015,.145); loose.rotation.y=Math.PI/12; three.dynamicGroup.add(loose);
}

function renderFallback(current){
  const root=$('fallbackBoard'); root.innerHTML='';
  if(!current) return;
  current.board.forEach((side,index)=>{
    const cell=document.createElement('div'); cell.className='fallback-cell';
    if(side){ cell.classList.add(side); cell.textContent=side==='black'?'●':'○'; }
    if(index===current.optimal_cell){ cell.classList.add('target'); cell.textContent=current.side_to_move==='black'?'●':'○'; }
    root.appendChild(cell);
  });
}

async function initThree(){
  try{
    const THREE=await import('three');
    const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
    const mount=$('threeMount'),renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputColorSpace=THREE.SRGBColorSpace; mount.appendChild(renderer.domElement);
    const scene=new THREE.Scene(); scene.background=new THREE.Color(0xedf0f2);
    const camera=new THREE.PerspectiveCamera(40,1,.01,5),defaultPosition=new THREE.Vector3(0,.36,.43),defaultTarget=new THREE.Vector3(0,.015,-.02);
    camera.position.copy(defaultPosition);
    const controls=new OrbitControls(camera,renderer.domElement); controls.target.copy(defaultTarget); controls.enableDamping=true; controls.minDistance=.24; controls.maxDistance=1.2; controls.maxPolarAngle=Math.PI*.47;
    scene.add(new THREE.HemisphereLight(0xffffff,0x8d969c,1.8));
    const sun=new THREE.DirectionalLight(0xffffff,2.1); sun.position.set(-.35,.7,.4); scene.add(sun);
    const table=new THREE.Mesh(new THREE.BoxGeometry(.45,.015,.45),new THREE.MeshStandardMaterial({color:0xbf5938,roughness:.78})); table.position.y=-.0075; scene.add(table);
    const boardGroup=new THREE.Group(),dynamicGroup=new THREE.Group(); scene.add(boardGroup,dynamicGroup);
    const base=new THREE.Mesh(new THREE.BoxGeometry(.2,.018,.2),new THREE.MeshStandardMaterial({color:0x858b93,roughness:.72})); base.position.set(0,.009,-.035); boardGroup.add(base);
    const dividerMaterial=new THREE.MeshStandardMaterial({color:0x62676f,roughness:.7}),cellSize=.2/3;
    for(const sign of [-1,1]){
      const offset=sign*cellSize/2;
      const vertical=new THREE.Mesh(new THREE.BoxGeometry(.0045,.009,.2),dividerMaterial); vertical.position.set(offset,.0225,-.035); boardGroup.add(vertical);
      const horizontal=new THREE.Mesh(new THREE.BoxGeometry(.2,.009,.0045),dividerMaterial); horizontal.position.set(0,.0225,-.035+offset); boardGroup.add(horizontal);
    }
    three={THREE,renderer,scene,camera,controls,dynamicGroup,defaultPosition,defaultTarget};
    const resize=()=>{const w=mount.clientWidth,h=mount.clientHeight;if(!w||!h)return;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();};
    new ResizeObserver(resize).observe(mount); resize();
    (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
    if(latest) rebuild(latest);
  }catch(error){
    console.error('Three.js 加载失败',error); $('threeMount').style.display='none'; $('resetView').style.display='none'; $('fallback').style.display='grid'; renderFallback(latest);
  }
}

function render(data){
  const current=data.current,progress=data.progress;
  $('progressText').textContent=`${progress.completed} / ${data.total} 已完成 · 剩余 ${progress.remaining}`;
  $('progressBar').style.width=`${progress.completed/data.total*100}%`;
  if(!current){
    latest=null; $('number').textContent='等待棋局…'; $('instruction').textContent='请在采集机选择 tic_tac_toe 任务集合。'; $('targetCell').textContent='—';
    for(const id of ['side','taskSlug','tactic','instanceStatus','stateId','layoutSeed']) $(id).textContent='—';
    if(three) disposeGroup(three.dynamicGroup); return;
  }
  latest=current;
  $('number').textContent=`#${String(current.display_number).padStart(3,'0')} / ${data.total}`;
  $('instruction').textContent=current.instruction;
  $('targetCell').textContent=`${current.optimal_cell} · ${current.optimal_cell_label}`;
  $('side').innerHTML=`<span class="side"><i class="piece ${current.side_to_move}"></i>${current.side_to_move==='black'?'执黑':'执白'}</span>`;
  $('taskSlug').textContent=current.task_slug; $('tactic').textContent=`${current.tactic} · ${current.tactic_label}`;
  $('instanceStatus').textContent=current.completed?'已完成':current.status==='encoding'?'编码中':current.status==='error'?'编码失败':'待采集';
  $('stateId').textContent=current.state_id;
  rebuild(current);
}

async function poll(){
  try{
    const response=await fetch('/api/tic-tac-toe/current',{cache:'no-store'}); if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const data=await response.json(),key=JSON.stringify([data.current?.selection_index,data.current?.status,data.progress.completed]);
    if(key!==lastKey){lastKey=key;render(data);} setConnection(true,'已同步');
  }catch(error){setConnection(false,`连接失败：${error.message}`);}
  setTimeout(poll,1000);
}

$('resetView').onclick=()=>{if(!three)return;three.camera.position.copy(three.defaultPosition);three.controls.target.copy(three.defaultTarget);three.controls.update();};
initThree(); poll();
</script>
</body>
</html>
